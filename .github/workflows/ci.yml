name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run pytest -q --strict-markers -m "not openrca_bank"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/viewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
