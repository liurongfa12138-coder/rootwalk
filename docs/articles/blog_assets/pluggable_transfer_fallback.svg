<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">可插拔库存调拨与自然降级</title>
  <desc id="desc">本地库存充足时直接进入原业务流程；不足时尝试跨机房调拨，调拨失败仍回到原有本地处理语义。</desc>
  <style>
    text { fill: #20242c; font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .heading { font-size: 28px; font-weight: 700; }
    .lane-title { font-size: 20px; font-weight: 700; }
    .node-title { font-size: 18px; font-weight: 650; text-anchor: middle; }
    .copy { font-size: 15px; fill: #596274; text-anchor: middle; }
    .edge-label { font-size: 14px; font-weight: 650; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; }
    .lane { stroke: #c8d0dc; stroke-width: 1.6; rx: 8; }
    .lane-main { fill: #eaf0fa; }
    .lane-plugin { fill: #f2ebfc; }
    .node { fill: #ffffff; stroke: #20242c; stroke-width: 1.7; rx: 6; }
    .core { fill: #e2f3e7; }
    .async-node { fill: #eee5fb; }
    .truth { fill: #f9e9ad; }
    .flow { fill: none; stroke-width: 2.3; }
    .sync { stroke: #2f8f5b; marker-end: url(#arrow-sync); }
    .weak { stroke: #7e57c2; stroke-dasharray: 8 6; marker-end: url(#arrow-weak); }
    .return { stroke: #596274; marker-end: url(#arrow-gray); }
    .focus { fill: #e53935; font-size: 20px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow-sync" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#2f8f5b"/></marker>
    <marker id="arrow-weak" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#7e57c2"/></marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#596274"/></marker>
  </defs>

  <rect width="1200" height="650" fill="#ffffff"/>
  <text class="heading" x="48" y="52">调拨前置：增强库存利用率，不接管原业务语义</text>

  <rect class="lane lane-main" x="50" y="92" width="1100" height="220"/>
  <text class="lane-title" x="76" y="126">原业务主链路</text>
  <rect class="node" x="92" y="166" width="180" height="82"/>
  <text class="node-title" x="182" y="199">活动 / 改库存请求</text>
  <text class="copy" x="182" y="226">沿用原接口和业务流水</text>
  <rect class="node core" x="355" y="166" width="190" height="82"/>
  <text class="node-title" x="450" y="199">检查本地可执行量</text>
  <text class="copy" x="450" y="226">逻辑库存 ∩ 物理库存</text>
  <rect class="node truth" x="902" y="166" width="190" height="82"/>
  <text class="node-title" x="997" y="199">执行原业务流程</text>
  <text class="copy" x="997" y="226">本地事务与业务流水</text>
  <path class="flow sync" d="M272 207H355"/>
  <path class="flow sync" d="M545 187H902"/>
  <text class="edge-label" x="678" y="176">本地库存足够：直接跳过调拨</text>

  <rect class="lane lane-plugin" x="50" y="338" width="1100" height="250"/>
  <text class="lane-title" x="76" y="374">跨机房调拨插件</text>
  <text class="copy" x="330" y="398">仅在本地不足时触发，属于弱依赖</text>
  <rect class="node async-node" x="355" y="416" width="190" height="92"/>
  <text class="node-title" x="450" y="450">查询全局可分配量</text>
  <text class="copy" x="450" y="478">不满足则不做部分调拨</text>
  <rect class="node async-node" x="650" y="416" width="190" height="92"/>
  <text class="node-title" x="745" y="450">先减后加调拨</text>
  <text class="copy" x="745" y="478">独立幂等流水与状态机</text>
  <path class="flow weak" d="M450 248V416"/>
  <text class="edge-label" x="462" y="332">本地不足</text>
  <path class="flow weak" d="M545 462H650"/>
  <text class="edge-label" x="582" y="449">全局足够</text>
  <path class="flow sync" d="M840 445H872V228H902"/>
  <text class="edge-label" x="860" y="398">调拨成功</text>
  <path class="flow return" d="M450 508V548H997V248"/>
  <text class="edge-label" x="590" y="537">查询失败 / 对端不足：回到原处理语义</text>
  <path class="flow return" d="M745 508V568H1032V248"/>
  <text class="edge-label" x="810" y="558">基础设施异常：记录后自然降级</text>
  <text class="focus" x="1080" y="470">★</text>
  <text class="copy" x="1010" y="496">最坏结果：库存利用率下降</text>
  <text class="copy" x="1010" y="518">本地交易链路仍可用</text>
</svg>
