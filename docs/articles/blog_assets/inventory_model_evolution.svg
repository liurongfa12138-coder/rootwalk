<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">库存模型从单层到跨机房共享的演进</title>
  <desc id="desc">库存模型依次解耦物理供给与业务承诺、销售视图与供给载体、逻辑共享与本地交易执行。</desc>
  <style>
    text { fill: #20242c; font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .heading { font-size: 28px; font-weight: 700; }
    .stage-title { font-size: 22px; font-weight: 700; text-anchor: middle; }
    .node-title { font-size: 18px; font-weight: 650; text-anchor: middle; }
    .copy { font-size: 15px; fill: #596274; text-anchor: middle; }
    .label { font-size: 14px; font-weight: 600; text-anchor: middle; }
    .stage { stroke: #c8d0dc; stroke-width: 1.7; rx: 8; }
    .stage-one { fill: #fcebd8; }
    .stage-two { fill: #eaf0fa; }
    .stage-three { fill: #eaf7ef; }
    .node { fill: #ffffff; stroke: #20242c; stroke-width: 1.6; rx: 6; }
    .truth { fill: #f9e9ad; }
    .view { fill: #e4eefc; }
    .unit { fill: #e2f3e7; stroke: #2f8f5b; stroke-width: 2.2; }
    .flow { fill: none; stroke: #596274; stroke-width: 2.2; marker-end: url(#arrow); }
    .sync { fill: none; stroke: #2f8f5b; stroke-width: 2.2; marker-end: url(#arrow-green); }
    .link { fill: none; stroke: #2d6cdf; stroke-width: 2; }
    .divider { stroke: #c8d0dc; stroke-width: 1.5; stroke-dasharray: 6 6; }
    .focus { fill: #e53935; font-size: 22px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#596274"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#2f8f5b"/></marker>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="heading" x="48" y="52">库存模型的三次解耦</text>
  <text class="copy" x="600" y="82">从“库存记在哪”演进到“一份逻辑供给、多个本地可交易分片”</text>

  <rect class="stage stage-one" x="40" y="112" width="320" height="520"/>
  <text class="stage-title" x="200" y="152">单层库存</text>
  <text class="copy" x="200" y="180">物理位置与业务数量绑定</text>
  <rect class="node truth" x="82" y="228" width="236" height="82"/>
  <text class="node-title" x="200" y="262">SKU + Warehouse</text>
  <text class="copy" x="200" y="288">一条记录同时表达位置与数量</text>
  <rect class="node" x="82" y="370" width="236" height="72"/>
  <text class="node-title" x="200" y="402">available_quantity</text>
  <text class="copy" x="200" y="426">现在还能卖多少</text>
  <rect class="node" x="82" y="480" width="236" height="72"/>
  <text class="node-title" x="200" y="512">withholding_quantity</text>
  <text class="copy" x="200" y="536">已经占用多少</text>
  <path class="flow" d="M200 310V370"/>
  <path class="flow" d="M200 442V480"/>

  <rect class="stage stage-two" x="440" y="112" width="320" height="520"/>
  <text class="stage-title" x="600" y="152">双层库存</text>
  <text class="copy" x="600" y="180">物理供给与业务承诺解耦</text>
  <rect class="node truth" x="482" y="220" width="236" height="86"/>
  <text class="node-title" x="600" y="254">物理库存层</text>
  <text class="copy" x="600" y="281">仓库存、可用量、占用量</text>
  <line class="divider" x1="478" y1="338" x2="722" y2="338"/>
  <text class="focus" x="706" y="331">=</text>
  <rect class="node view" x="482" y="370" width="236" height="160"/>
  <text class="node-title" x="600" y="405">逻辑库存层</text>
  <text class="copy" x="600" y="436">开放库存</text>
  <text class="copy" x="600" y="466">活动库存 / 渠道库存</text>
  <text class="copy" x="600" y="496">释放时回补来源节点</text>
  <path class="sync" d="M600 306V370"/>
  <text class="label" x="644" y="346">总量守恒</text>
  <text class="copy" x="600" y="586">同一 SKU 范围内，物理总量 = 逻辑总量</text>

  <rect class="stage stage-three" x="840" y="112" width="320" height="520"/>
  <text class="stage-title" x="1000" y="152">跨机房共享</text>
  <text class="copy" x="1000" y="180">逻辑共享与本地执行解耦</text>
  <rect class="node unit" x="912" y="214" width="176" height="66"/>
  <text class="node-title" x="1000" y="245">Unit SKU</text>
  <text class="copy" x="1000" y="267">同一份逻辑供给</text>
  <rect class="node view" x="870" y="340" width="124" height="94"/>
  <text class="node-title" x="932" y="374">US 分片</text>
  <text class="copy" x="932" y="401">本地可交易 60</text>
  <rect class="node view" x="1006" y="340" width="124" height="94"/>
  <text class="node-title" x="1068" y="374">MX 分片</text>
  <text class="copy" x="1068" y="401">本地可交易 40</text>
  <path class="link" d="M970 280V310H932V340"/>
  <path class="link" d="M1030 280V310H1068V340"/>
  <rect class="node" x="884" y="494" width="232" height="72"/>
  <text class="node-title" x="1000" y="526">逻辑共享总量 100</text>
  <text class="copy" x="1000" y="550">本地交易，动态重分配</text>
  <path class="sync" d="M932 434V466H1000V494"/>
  <path class="sync" d="M1068 434V466H1000V494"/>

  <path class="flow" d="M360 372H440"/>
  <text class="label" x="400" y="352">拆层</text>
  <path class="flow" d="M760 372H840"/>
  <text class="label" x="800" y="352">分片</text>
</svg>
