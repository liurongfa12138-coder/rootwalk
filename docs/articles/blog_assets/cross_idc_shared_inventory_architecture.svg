<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">跨机房共享库存总体架构</title>
  <desc id="desc">商家侧聚合全局库存，消费者交易在本机房闭环，Unit SKU 和 Warehouse Group 连接各机房分片，异步调拨与对账维持最终一致。</desc>
  <style>
    text { fill: #20242c; font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .heading { font-size: 28px; font-weight: 700; }
    .layer-title { font-size: 20px; font-weight: 700; }
    .node-title { font-size: 18px; font-weight: 650; text-anchor: middle; }
    .copy { font-size: 15px; fill: #596274; text-anchor: middle; }
    .edge-label { font-size: 14px; font-weight: 650; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; text-anchor: middle; }
    .layer { stroke: #c8d0dc; stroke-width: 1.6; rx: 8; }
    .business { fill: #fcebd8; }
    .relation { fill: #eaf0fa; }
    .storage { fill: #fff4d6; }
    .derived { fill: #f2ebfc; }
    .node { fill: #ffffff; stroke: #20242c; stroke-width: 1.7; rx: 6; }
    .core { fill: #e2f3e7; }
    .truth { fill: #f9e9ad; }
    .view { fill: #e4eefc; }
    .async-node { fill: #eee5fb; }
    .flow { fill: none; stroke-width: 2.3; }
    .sync { stroke: #2f8f5b; marker-end: url(#arrow-sync); }
    .read { stroke: #2d6cdf; marker-end: url(#arrow-read); }
    .async { stroke: #7e57c2; stroke-dasharray: 8 6; marker-end: url(#arrow-async); }
    .focus { fill: #e53935; font-size: 22px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow-sync" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#2f8f5b"/></marker>
    <marker id="arrow-read" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#2d6cdf"/></marker>
    <marker id="arrow-async" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#7e57c2"/></marker>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <text class="heading" x="48" y="48">一份逻辑共享库存，多个机房本地交易</text>

  <rect class="layer business" x="56" y="84" width="1088" height="132"/>
  <text class="layer-title" x="80" y="118">业务视图</text>
  <rect class="node" x="160" y="132" width="220" height="62"/>
  <text class="node-title" x="270" y="158">商家 B 端</text>
  <text class="copy" x="270" y="181">查询与修改共享总量</text>
  <rect class="node" x="490" y="132" width="220" height="62"/>
  <text class="node-title" x="600" y="158">US 消费者</text>
  <text class="copy" x="600" y="181">只承诺 US 本地库存</text>
  <rect class="node" x="820" y="132" width="220" height="62"/>
  <text class="node-title" x="930" y="158">MX 消费者</text>
  <text class="copy" x="930" y="181">只承诺 MX 本地库存</text>

  <rect class="layer relation" x="56" y="240" width="1088" height="176"/>
  <text class="layer-title" x="80" y="274">共享关系与全局管理</text>
  <rect class="node view" x="150" y="304" width="240" height="78"/>
  <text class="node-title" x="270" y="334">全局聚合视图</text>
  <text class="copy" x="270" y="360">US 分片 + MX 分片</text>
  <rect class="node core" x="480" y="292" width="240" height="102"/>
  <text class="focus" x="694" y="319">★</text>
  <text class="node-title" x="600" y="326">Unit SKU</text>
  <text class="copy" x="600" y="352">同一份逻辑供给</text>
  <text class="copy" x="600" y="375">Local SKU 指向供给载体</text>
  <rect class="node view" x="810" y="304" width="240" height="78"/>
  <text class="node-title" x="930" y="334">Warehouse Group</text>
  <text class="copy" x="930" y="360">跨市场逻辑共享仓</text>
  <path class="flow read" d="M270 194V304"/>
  <text class="edge-label" x="318" y="252">聚合查询</text>
  <path class="flow sync" d="M390 343H480"/>
  <path class="flow sync" d="M720 343H810"/>

  <rect class="layer storage" x="56" y="440" width="1088" height="236"/>
  <text class="layer-title" x="80" y="474">机房内权威库存事实</text>
  <rect class="node truth" x="112" y="512" width="420" height="122"/>
  <text class="node-title" x="322" y="542">US 本地库存分片</text>
  <text class="copy" x="322" y="570">逻辑库存：开放 / 活动 / 渠道</text>
  <text class="copy" x="322" y="596">物理库存：Warehouse 明细</text>
  <text class="copy" x="322" y="620">导购与交易在本地事务闭环</text>
  <rect class="node truth" x="668" y="512" width="420" height="122"/>
  <text class="node-title" x="878" y="542">MX 本地库存分片</text>
  <text class="copy" x="878" y="570">逻辑库存：开放 / 活动 / 渠道</text>
  <text class="copy" x="878" y="596">物理库存：Warehouse 明细</text>
  <text class="copy" x="878" y="620">导购与交易在本地事务闭环</text>
  <path class="flow sync" d="M560 394V456H322V512"/>
  <path class="flow sync" d="M640 394V456H878V512"/>
  <path class="flow read" d="M600 194V228H430V456H322V512"/>
  <path class="flow read" d="M930 194V228H1100V456H878V512"/>

  <rect class="layer derived" x="56" y="700" width="1088" height="86"/>
  <text class="layer-title" x="80" y="735">最终一致能力</text>
  <rect class="node async-node" x="220" y="722" width="220" height="44"/>
  <text class="node-title" x="330" y="750">动态重分配</text>
  <rect class="node async-node" x="490" y="722" width="220" height="44"/>
  <text class="node-title" x="600" y="750">持久化状态机</text>
  <rect class="node async-node" x="760" y="722" width="220" height="44"/>
  <text class="node-title" x="870" y="750">对账与漂移修复</text>
  <path class="flow async" d="M322 634V688H330V722"/>
  <path class="flow async" d="M878 634V688H870V722"/>
  <path class="flow async" d="M440 744H490"/>
  <path class="flow async" d="M710 744H760"/>
  <path class="flow async" d="M600 722V688H600"/>
  <text class="edge-label" x="600" y="684">先减后加，失败可恢复</text>
</svg>
